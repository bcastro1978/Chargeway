<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filtro de Sombra de Tarjeta de Crédito / RFID -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00D2FF" flood-opacity="0.25" />
    </filter>

    <!-- Fondo de Tarjeta Carbon Weave + Mesh Neón -->
    <radialGradient id="card-mesh" cx="15%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#142136" />
      <stop offset="45%" stop-color="#0A101C" />
      <stop offset="100%" stop-color="#03060C" />
    </radialGradient>

    <!-- Borde Holográfico Iridiscente -->
    <linearGradient id="holo-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="25%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#00F5A0" />
      <stop offset="75%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Chip EMV Dorado / Platino -->
    <linearGradient id="chip-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
  </defs>

  <!-- Tarjeta Base (85.6mm x 53.98mm proporción estándar CR80) -->
  <g transform="translate(60, 45)" filter="url(#card-shadow)">
    <!-- Cuerpo de la tarjeta -->
    <rect width="880" height="540" rx="32" ry="32" fill="url(#card-mesh)" stroke="url(#holo-border)" stroke-width="2.5" />

    <!-- Traza de Autopista Vectorial de Fondo Suave -->
    <path d="M 0 380 C 250 320 400 240 600 280 S 800 180 880 120" fill="none" stroke="#00D2FF" stroke-width="3" opacity="0.18" />
    <path d="M 0 420 C 270 360 420 280 620 320 S 820 220 880 160" fill="none" stroke="#00F5A0" stroke-width="2" opacity="0.12" />

    <!-- Chip RFID / NFC Contactless Simulado -->
    <g transform="translate(65, 175)">
      <rect width="78" height="60" rx="8" ry="8" fill="url(#chip-metal)" stroke="#A16207" stroke-width="1.5" />
      <!-- Líneas internas del chip -->
      <line x1="26" y1="0" x2="26" y2="60" stroke="#854D0E" stroke-width="1" />
      <line x1="52" y1="0" x2="52" y2="60" stroke="#854D0E" stroke-width="1" />
      <line x1="0" y1="30" x2="78" y2="30" stroke="#854D0E" stroke-width="1" />
      <rect x="22" y="18" width="34" height="24" rx="4" fill="none" stroke="#854D0E" stroke-width="1" />
    </g>

    <!-- Símbolo Contactless Ondas de Radio -->
    <g transform="translate(165, 185)" stroke="#00D2FF" stroke-width="2.5" fill="none" opacity="0.85">
      <path d="M 0 10 A 15 15 0 0 1 0 30" />
      <path d="M 8 5 A 25 25 0 0 1 8 35" />
      <path d="M 16 0 A 35 35 0 0 1 16 40" />
    </g>

    <!-- Logo ChargeWay Oficial Completo con Isotipo (Esquina Superior Izquierda) -->
    <g transform="translate(65, 38)">
      <!-- Isotipo Oficial de ChargeWay Escalado -->
      <g transform="translate(-15, -15) scale(0.18)">
        <path d="M 256 60 C 150 60 76 142 76 242 C 76 312 136 386 216 452 L 256 488 C 240 450 200 380 180 340 C 146 276 136 240 136 216 C 136 150 186 112 256 112 C 302 112 340 132 366 166 L 406 130 C 370 86 318 60 256 60 Z" fill="#94A3B8" stroke="#00F5A0" stroke-width="4" />
        <path d="M 374 168 C 410 214 424 266 414 316 C 400 386 338 440 256 488 C 290 440 340 376 356 320 C 370 270 358 224 330 188 L 374 168 Z" fill="#0F172A" stroke="#00D2FF" stroke-width="6" />
        <path d="M 346 198 C 370 240 374 285 362 334 C 346 390 298 446 260 482" fill="none" stroke="#00F5A0" stroke-width="8" stroke-dasharray="14 18" stroke-linecap="round" />
        <polygon points="280,100 196,248 266,248 226,376 332,224 260,224" fill="#00D2FF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
        <polygon points="276,118 208,244 264,244 236,346 314,228 258,228" fill="#FFFFFF" opacity="0.8" />
        <circle cx="256" cy="488" r="14" fill="#00F5A0" />
      </g>
      <!-- Texto Tipográfico -->
      <g transform="translate(80, 22)">
        <text font-family="'Syne', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">
          Charge<tspan fill="#00D2FF">Way</tspan>
        </text>
        <text y="24" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#00F5A0" letter-spacing="3">
          ULTRA-FAST RFID PASS // ECUADOR
        </text>
      </g>
    </g>

    <!-- Holograma de Seguridad Hexagonal (Esquina Superior Derecha) -->
    <g transform="translate(740, 45)">
      <polygon points="40,0 80,24 80,70 40,94 0,70 0,24" fill="#0E1726" stroke="#00D2FF" stroke-width="1.5" />
      <polygon points="40,12 68,28 68,64 40,80 12,64 12,28" fill="none" stroke="#00F5A0" stroke-width="1" stroke-dasharray="3 3" />
      <!-- Mini rayo central -->
      <polygon points="42,28 32,48 40,48 36,66 48,44 40,44" fill="#FFFFFF" />
      <text x="40" y="112" font-family="'Space Mono', monospace" font-size="8" fill="#64748B" text-anchor="middle" letter-spacing="1">
        VERIFIED NFC
      </text>
    </g>

    <!-- Número Identificador de la Tarjeta / Token Criptográfico -->
    <g transform="translate(65, 335)">
      <text font-family="'Space Mono', monospace" font-size="24" font-weight="700" fill="#E2E8F0" letter-spacing="4">
        5930 • 7842 • 1089 • 2026
      </text>
      <text y="30" font-family="'Space Mono', monospace" font-size="11" fill="#64748B" letter-spacing="2">
        MEMBER SINCE: 06/26  •  SECURITY HASH: CW-EC-88F4
      </text>
    </g>

    <!-- Datos del Conductor y Nivel de Membresía -->
    <g transform="translate(65, 440)">
      <text font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
        BORIS CASTRO
      </text>
      <text y="24" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1.5">
        PRO DRIVER // BYD FLEET PILOT
      </text>
    </g>

    <!-- Mini Código QR de Activación Digital (Esquina Inferior Derecha) -->
    <g transform="translate(735, 390)">
      <rect width="85" height="85" rx="10" fill="#FFFFFF" />
      <!-- Patrón de QR estilizado -->
      <g fill="#070B12">
        <rect x="8" y="8" width="24" height="24" rx="3" />
        <rect x="12" y="12" width="16" height="16" fill="#FFFFFF" />
        <rect x="16" y="16" width="8" height="8" />

        <rect x="53" y="8" width="24" height="24" rx="3" />
        <rect x="57" y="12" width="16" height="16" fill="#FFFFFF" />
        <rect x="61" y="16" width="8" height="8" />

        <rect x="8" y="53" width="24" height="24" rx="3" />
        <rect x="12" y="57" width="16" height="16" fill="#FFFFFF" />
        <rect x="16" y="61" width="8" height="8" />

        <rect x="40" y="40" width="8" height="8" />
        <rect x="52" y="40" width="6" height="12" />
        <rect x="40" y="54" width="12" height="6" />
        <rect x="60" y="60" width="14" height="14" />
      </g>
      <text x="42" y="102" font-family="'Space Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">
        1-TAP CHARGE
      </text>
    </g>
  </g>
</svg>
