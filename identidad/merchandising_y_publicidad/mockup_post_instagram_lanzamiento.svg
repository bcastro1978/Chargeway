<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="ig-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#112238" />
      <stop offset="60%" stop-color="#070B12" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <linearGradient id="ig-electric" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <filter id="ig-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <!-- Fondo Principal Cuadrado 1080x1080 -->
  <rect width="1080" height="1080" fill="url(#ig-glow)" />

  <!-- Destellos Neón en Fondo -->
  <circle cx="200" cy="200" r="280" fill="#00D2FF" opacity="0.15" filter="url(#ig-blur)" />
  <circle cx="880" cy="880" r="320" fill="#00F5A0" opacity="0.12" filter="url(#ig-blur)" />

  <!-- Cuadrícula HUD Sutil de Fondo -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="0" y1="120" x2="1080" y2="120" />
    <line x1="0" y1="960" x2="1080" y2="960" />
  </g>

  <!-- Encabezado: Logo Oficial ChargeWay con Isotipo y Badge de Lanzamiento -->
  <g transform="translate(100, 95)">
    <!-- Isotipo Oficial de ChargeWay -->
    <g transform="translate(0, -10) scale(0.2)">
      <path d="M 256 60 C 150 60 76 142 76 242 C 76 312 136 386 216 452 L 256 488 C 240 450 200 380 180 340 C 146 276 136 240 136 216 C 136 150 186 112 256 112 C 302 112 340 132 366 166 L 406 130 C 370 86 318 60 256 60 Z" fill="#94A3B8" stroke="#00F5A0" stroke-width="4" />
      <path d="M 374 168 C 410 214 424 266 414 316 C 400 386 338 440 256 488 C 290 440 340 376 356 320 C 370 270 358 224 330 188 L 374 168 Z" fill="#0F172A" stroke="#00D2FF" stroke-width="6" />
      <path d="M 346 198 C 370 240 374 285 362 334 C 346 390 298 446 260 482" fill="none" stroke="#00F5A0" stroke-width="8" stroke-dasharray="14 18" stroke-linecap="round" />
      <polygon points="280,100 196,248 266,248 226,376 332,224 260,224" fill="#00D2FF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
      <polygon points="276,118 208,244 264,244 236,346 314,228 258,228" fill="#FFFFFF" opacity="0.8" />
      <circle cx="256" cy="488" r="14" fill="#00F5A0" />
    </g>
    <!-- Texto -->
    <g transform="translate(100, 32)">
      <text font-family="'Syne', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">
        Charge<tspan fill="#00D2FF">Way</tspan>
      </text>
    </g>

    <!-- Badge Oficial -->
    <g transform="translate(680, 5)">
      <rect width="200" height="38" rx="19" fill="#00D2FF" fill-opacity="0.15" stroke="#00D2FF" stroke-width="1.5" />
      <text x="100" y="24" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="2">
        LANZAMIENTO 2026
      </text>
    </g>
  </g>

  <!-- Titular Principal de Campaña -->
  <g transform="translate(100, 240)">
    <text font-family="'Space Mono', monospace" font-size="16" font-weight="700" fill="#00F5A0" letter-spacing="4">
      // LA REVOLUCIÓN DE LA MOVILIDAD ELÉCTRICA EN ECUADOR
    </text>
    <text y="70" font-family="'Syne', sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" line-height="1.1" letter-spacing="-1.5">
      CONQUISTA CADA
    </text>
    <text y="145" font-family="'Syne', sans-serif" font-size="64" font-weight="900" fill="url(#ig-electric)" line-height="1.1" letter-spacing="-1.5">
      KILÓMETRO DE LOS ANDES.
    </text>
  </g>

  <!-- Bento Grid de Características (3 Tarjetas) -->
  <g transform="translate(100, 440)">
    <!-- Tarjeta 1: Física Real -->
    <g transform="translate(0, 0)">
      <rect width="275" height="230" rx="20" fill="#0F172A" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
      <text x="24" y="45" font-family="'Space Mono', monospace" font-size="30" fill="#00D2FF">01</text>
      <text x="24" y="90" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Física y Altimetría</text>
      <text x="24" y="125" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#94A3B8">
        Modelamos el consumo real contemplando pendientes, clima y regeneración.
      </text>
    </g>

    <!-- Tarjeta 2: Red Nacional -->
    <g transform="translate(305, 0)">
      <rect width="275" height="230" rx="20" fill="#0F172A" stroke="rgba(0, 245, 160, 0.3)" stroke-width="1.5" />
      <text x="24" y="45" font-family="'Space Mono', monospace" font-size="30" fill="#00F5A0">02</text>
      <text x="24" y="90" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">200+ Puntos Carga</text>
      <text x="24" y="125" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#94A3B8">
        Mapeo completo de cargadores rápidos (AC y DC) en Sierra, Costa y Oriente.
      </text>
    </g>

    <!-- Tarjeta 3: Copiloto IA -->
    <g transform="translate(610, 0)">
      <rect width="270" height="230" rx="20" fill="#0F172A" stroke="rgba(0, 210, 255, 0.3)" stroke-width="1.5" />
      <text x="24" y="45" font-family="'Space Mono', monospace" font-size="30" fill="#38BDF8">03</text>
      <text x="24" y="90" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Copiloto IA en Vivo</text>
      <text x="24" y="125" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#94A3B8">
        Asesor de voz que te sugiere velocidad y paradas óptimas para llegar seguro.
      </text>
    </g>
  </g>

  <!-- Indicador Social Proof / Vehículos Compatibles -->
  <g transform="translate(100, 720)">
    <text font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#64748B" letter-spacing="2">
      COMPATIBLE CON TODAS LAS MARCAS EV DE ECUADOR:
    </text>
    <text y="32" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#CBD5E1" letter-spacing="3">
      BYD • TESLA • KIA • HYUNDAI • AUDI • PORSCHE • DONGFENG
    </text>
  </g>

  <!-- Footer con Call to Action -->
  <g transform="translate(100, 830)">
    <rect width="880" height="120" rx="24" fill="#0A111E" stroke="#00D2FF" stroke-width="2" />
    
    <g transform="translate(40, 48)">
      <text font-family="'Syne', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">
        Empieza tu primer viaje sin ansiedad
      </text>
      <text y="28" font-family="'Space Grotesk', sans-serif" font-size="15" fill="#00F5A0">
        Acceso libre y 100% gratuito para conductores
      </text>
    </g>

    <!-- Botón CTA -->
    <g transform="translate(560, 32)">
      <rect width="280" height="56" rx="28" fill="url(#ig-electric)" />
      <text x="140" y="35" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" fill="#020617" text-anchor="middle">
        PROBAR CHARGEWAY ➔
      </text>
    </g>
  </g>

  <!-- Enlace final -->
  <text x="540" y="1020" font-family="'Space Mono', monospace" font-size="14" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">
    WWW.CHARGEWAY.EC // @CHARGEWAY.EC
  </text>
</svg>
