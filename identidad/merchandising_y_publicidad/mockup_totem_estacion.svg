<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 1100" width="100%" height="100%" fill="none">
  <defs>
    <filter id="totem-shadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="0" dy="30" stdDeviation="35" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#00D2FF" flood-opacity="0.25" />
    </filter>

    <linearGradient id="totem-pylon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="35%" stop-color="#0F172A" />
      <stop offset="70%" stop-color="#090E17" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>

    <linearGradient id="totem-accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="led-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Tótem Físico Exterior de Estación de Carga (Proporción Monolítica 1:2.5) -->
  <g transform="translate(60, 40)" filter="url(#totem-shadow)">
    <!-- Base de Concreto / Acero Inoxidable -->
    <path d="M 30 960 L 350 960 L 370 1020 L 10 1020 Z" fill="#334155" stroke="#475569" stroke-width="2" />
    
    <!-- Monolito Vertical Principal -->
    <rect x="40" y="20" width="300" height="940" rx="20" fill="url(#totem-pylon)" stroke="#00D2FF" stroke-width="2.5" />

    <!-- Franja Lumínica Neón Lateral Izquierda (LED Status Strip) -->
    <rect x="48" y="30" width="8" height="920" rx="4" fill="url(#totem-accent)" filter="url(#led-glow)" />

    <!-- 1. Cabezal Iluminado: Logo Oficial ChargeWay con Isotipo -->
    <g transform="translate(65, 60)">
      <!-- Isotipo ChargeWay -->
      <g transform="translate(0, -10) scale(0.15)">
        <path d="M 256 60 C 150 60 76 142 76 242 C 76 312 136 386 216 452 L 256 488 C 240 450 200 380 180 340 C 146 276 136 240 136 216 C 136 150 186 112 256 112 C 302 112 340 132 366 166 L 406 130 C 370 86 318 60 256 60 Z" fill="#94A3B8" stroke="#00F5A0" stroke-width="4" />
        <path d="M 374 168 C 410 214 424 266 414 316 C 400 386 338 440 256 488 C 290 440 340 376 356 320 C 370 270 358 224 330 188 L 374 168 Z" fill="#0F172A" stroke="#00D2FF" stroke-width="6" />
        <path d="M 346 198 C 370 240 374 285 362 334 C 346 390 298 446 260 482" fill="none" stroke="#00F5A0" stroke-width="8" stroke-dasharray="14 18" stroke-linecap="round" />
        <polygon points="280,100 196,248 266,248 226,376 332,224 260,224" fill="#00D2FF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
        <polygon points="276,118 208,244 264,244 236,346 314,228 258,228" fill="#FFFFFF" opacity="0.8" />
        <circle cx="256" cy="488" r="14" fill="#00F5A0" />
      </g>
      <!-- Texto -->
      <g transform="translate(75, 20)">
        <text font-family="'Syne', sans-serif" font-size="26" font-weight="900" fill="#FFFFFF">
          Charge<tspan fill="#00D2FF">Way</tspan>
        </text>
        <text y="22" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#00F5A0" letter-spacing="2.5">
          ULTRA-FAST HUB 60kW
        </text>
      </g>
      <line x1="0" y1="52" x2="250" y2="52" stroke="#334155" stroke-width="1" />
    </g>

    <!-- 2. Display Digital LED: Potencia y Estado de Conectores -->
    <g transform="translate(75, 160)">
      <!-- Panel Digital -->
      <rect width="230" height="150" rx="12" fill="#020408" stroke="#1E293B" stroke-width="1.5" />
      
      <!-- Estado General -->
      <circle cx="25" cy="30" r="7" fill="#00F5A0" filter="url(#led-glow)" />
      <text x="42" y="35" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">
        ESTACIÓN DISPONIBLE
      </text>

      <!-- Potencia Nominal -->
      <text x="25" y="85" font-family="'Space Mono', monospace" font-size="34" font-weight="900" fill="#00D2FF">
        60 <tspan font-size="18" fill="#94A3B8">kW DC</tspan>
      </text>
      <text x="25" y="108" font-family="'Space Mono', monospace" font-size="10" fill="#64748B">
        VOLTAJE RANGO: 200V - 750V
      </text>
      <text x="25" y="128" font-family="'Space Mono', monospace" font-size="10" fill="#00F5A0">
        TARIFA ARCONEL: $0.1994 /kWh
      </text>
    </g>

    <!-- 3. Indicador de Puertos Físicos y Conectores -->
    <g transform="translate(75, 345)">
      <!-- Conector 1: CCS2 (Disponible) -->
      <g transform="translate(0, 0)">
        <rect width="230" height="75" rx="10" fill="#0D1626" stroke="#00F5A0" stroke-width="1.5" />
        <circle cx="25" cy="38" r="6" fill="#00F5A0" />
        <text x="42" y="32" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">PUERTO 1: CCS2</text>
        <text x="42" y="52" font-family="'Space Mono', monospace" font-size="11" fill="#00F5A0">DISPONIBLE // 60 kW</text>
      </g>

      <!-- Conector 2: GB/T (En Carga) -->
      <g transform="translate(0, 90)">
        <rect width="230" height="75" rx="10" fill="#0D1626" stroke="#00D2FF" stroke-width="1.5" />
        <circle cx="25" cy="38" r="6" fill="#00D2FF" />
        <text x="42" y="32" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">PUERTO 2: GB/T</text>
        <text x="42" y="52" font-family="'Space Mono', monospace" font-size="11" fill="#38BDF8">DISPONIBLE // 60 kW</text>
      </g>
    </g>

    <!-- 4. Lector RFID y Contactless Integrado en el Tótem -->
    <g transform="translate(75, 540)">
      <rect width="230" height="110" rx="12" fill="#0B1321" stroke="#334155" stroke-width="1" />
      <circle cx="115" cy="45" r="22" fill="#00D2FF" fill-opacity="0.1" stroke="#00D2FF" stroke-width="1.5" />
      <!-- Ondas Contactless -->
      <path d="M 110 37 A 8 8 0 0 1 110 53" stroke="#00D2FF" stroke-width="2" fill="none" />
      <path d="M 115 32 A 14 14 0 0 1 115 58" stroke="#00D2FF" stroke-width="2" fill="none" />
      <text x="115" y="85" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
        ACERCA TU TARJETA RFID
      </text>
      <text x="115" y="100" font-family="'Space Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">
        O USA TU APP CHARGEWAY
      </text>
    </g>

    <!-- 5. Código QR de Activación Móvil Directa -->
    <g transform="translate(145, 680)">
      <rect width="90" height="90" rx="10" fill="#FFFFFF" />
      <!-- Mini QR Vectorial -->
      <g fill="#070B12" transform="translate(10, 10)">
        <rect x="0" y="0" width="22" height="22" rx="2" />
        <rect x="4" y="4" width="14" height="14" fill="#FFFFFF" />
        <rect x="7" y="7" width="8" height="8" />

        <rect x="48" y="0" width="22" height="22" rx="2" />
        <rect x="52" y="4" width="14" height="14" fill="#FFFFFF" />
        <rect x="55" y="7" width="8" height="8" />

        <rect x="0" y="48" width="22" height="22" rx="2" />
        <rect x="4" y="52" width="14" height="14" fill="#FFFFFF" />
        <rect x="7" y="55" width="8" height="8" />

        <rect x="30" y="30" width="10" height="10" fill="#00D2FF" />
      </g>
      <text x="45" y="112" font-family="'Space Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">
        ESCANEAR PARA CARGAR
      </text>
    </g>

    <!-- 6. Información de Emergencia y Soporte 24/7 -->
    <g transform="translate(75, 830)">
      <text font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#94A3B8">
        SOPORTE DE RED 24/7
      </text>
      <text y="20" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#FFFFFF">
        1800-CHARGEWAY (242-743)
      </text>
      <text y="40" font-family="'Space Mono', monospace" font-size="9" fill="#64748B">
        RED NACIONAL SAAS ECUADOR
      </text>
    </g>
  </g>
</svg>
