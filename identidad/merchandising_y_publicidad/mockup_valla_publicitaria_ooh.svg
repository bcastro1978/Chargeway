<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradiente Valla Exterior OOH -->
    <linearGradient id="billboard-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1A" />
      <stop offset="50%" stop-color="#091426" />
      <stop offset="100%" stop-color="#02050A" />
    </linearGradient>

    <linearGradient id="neon-text-electric" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <linearGradient id="btn-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <filter id="billboard-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Marco Exterior de Valla Publicitaria -->
  <rect width="1200" height="600" fill="url(#billboard-sky)" stroke="#00D2FF" stroke-width="3" />

  <!-- Silueta Topográfica Andina Vectorial de Fondo (Páramo / Volcanes) -->
  <path d="M 0 450 Q 250 350 480 430 T 900 320 T 1200 400 L 1200 600 L 0 600 Z" fill="#0E1B30" opacity="0.6" />
  <path d="M 0 480 Q 280 400 520 460 T 960 380 T 1200 450 L 1200 600 L 0 600 Z" fill="#09111E" opacity="0.8" />

  <!-- Autopista E35 Brillante en la Valla -->
  <path d="M 0 580 C 350 560 550 510 750 470 S 1050 410 1200 370" fill="none" stroke="#00D2FF" stroke-width="8" stroke-linecap="round" opacity="0.7" filter="url(#billboard-glow)" />
  <path d="M 0 580 C 350 560 550 510 750 470 S 1050 410 1200 370" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="16 20" />

  <!-- Balizas de Carga en la Valla (Puntos de Carga en la Ruta) -->
  <g transform="translate(420, 530)">
    <circle r="14" fill="#00F5A0" opacity="0.3" filter="url(#billboard-glow)" />
    <circle r="6" fill="#00F5A0" />
    <text x="16" y="4" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#00F5A0">Terpel Calderón 60kW</text>
  </g>
  <g transform="translate(850, 450)">
    <circle r="14" fill="#00D2FF" opacity="0.3" filter="url(#billboard-glow)" />
    <circle r="6" fill="#00D2FF" />
    <text x="16" y="4" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#00D2FF">Hostelería Pimán 22kW</text>
  </g>

  <!-- Contenido Publicitario Izquierda -->
  <g transform="translate(80, 100)">
    <!-- Logo Oficial ChargeWay con Isotipo en Valla -->
    <g transform="translate(0, -10)">
      <g transform="translate(0, -15) scale(0.22)">
        <path d="M 256 60 C 150 60 76 142 76 242 C 76 312 136 386 216 452 L 256 488 C 240 450 200 380 180 340 C 146 276 136 240 136 216 C 136 150 186 112 256 112 C 302 112 340 132 366 166 L 406 130 C 370 86 318 60 256 60 Z" fill="#94A3B8" stroke="#00F5A0" stroke-width="4" />
        <path d="M 374 168 C 410 214 424 266 414 316 C 400 386 338 440 256 488 C 290 440 340 376 356 320 C 370 270 358 224 330 188 L 374 168 Z" fill="#0F172A" stroke="#00D2FF" stroke-width="6" />
        <path d="M 346 198 C 370 240 374 285 362 334 C 346 390 298 446 260 482" fill="none" stroke="#00F5A0" stroke-width="8" stroke-dasharray="14 18" stroke-linecap="round" />
        <polygon points="280,100 196,248 266,248 226,376 332,224 260,224" fill="#00D2FF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
        <polygon points="276,118 208,244 264,244 236,346 314,228 258,228" fill="#FFFFFF" opacity="0.8" />
        <circle cx="256" cy="488" r="14" fill="#00F5A0" />
      </g>
      <g transform="translate(105, 30)">
        <text font-family="'Syne', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">
          Charge<tspan fill="#00D2FF">Way</tspan>
        </text>
        <text x="245" y="-12" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#00F5A0" letter-spacing="3">
          ECUADOR
        </text>
      </g>
    </g>

    <!-- Titular de Campaña de Alto Impacto -->
    <g transform="translate(0, 85)">
      <text font-family="'Syne', sans-serif" font-size="52" font-weight="900" fill="url(#neon-text-electric)" letter-spacing="-1">
        ¿VIAJAR EN EV POR LOS ANDES?
      </text>
      <text y="62" font-family="'Syne', sans-serif" font-size="52" font-weight="900" fill="#00F5A0" letter-spacing="-1">
        CERO ANSIEDAD DE AUTONOMÍA.
      </text>
    </g>

    <!-- Subtitular / Propuesta de Valor -->
    <g transform="translate(0, 220)">
      <text font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="600" fill="#CBD5E1">
        Cálculo de energía con física real, altimetría andina y más de 200 cargadores.
      </text>
      <text y="32" font-family="'Space Grotesk', sans-serif" font-size="18" fill="#94A3B8">
        El copiloto inteligente que te dice con cuánto % de batería llegas a tu destino.
      </text>
    </g>

    <!-- Llamado a la Acción (CTA) -->
    <g transform="translate(0, 310)">
      <rect width="320" height="65" rx="33" fill="url(#btn-glow)" />
      <text x="160" y="40" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" fill="#020617" text-anchor="middle" letter-spacing="1">
        PLANIFICA GRATIS AHORA ➔
      </text>
      <text x="350" y="40" font-family="'Space Mono', monospace" font-size="22" font-weight="700" fill="#FFFFFF">
        chargeway.ec
      </text>
    </g>
  </g>

  <!-- Mockup Móvil de la App en la Valla (Derecha) -->
  <g transform="translate(860, 80)">
    <!-- Marco del Celular -->
    <rect width="260" height="440" rx="36" fill="#0A0E17" stroke="#00D2FF" stroke-width="3" filter="url(#billboard-glow)" />
    <!-- Pantalla del Celular con UI -->
    <rect x="12" y="12" width="236" height="416" rx="26" fill="#070B12" />
    
    <!-- Header App -->
    <text x="130" y="45" font-family="'Syne', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      Charge<tspan fill="#00D2FF">Way</tspan>
    </text>

    <!-- Medidor SoC -->
    <g transform="translate(30, 80)">
      <circle cx="88" cy="70" r="50" fill="none" stroke="#1E293B" stroke-width="10" />
      <circle cx="88" cy="70" r="50" fill="none" stroke="#00F5A0" stroke-width="10" stroke-dasharray="240 314" stroke-linecap="round" />
      <text x="88" y="76" font-family="'Space Mono', monospace" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">79%</text>
      <text x="88" y="94" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#00F5A0" text-anchor="middle">Batería Óptima</text>
    </g>

    <!-- Ruta Quito -> Cuenca -->
    <g transform="translate(30, 220)">
      <rect width="176" height="55" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="15" y="24" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Quito ➔ Cuenca</text>
      <text x="15" y="42" font-family="'Space Mono', monospace" font-size="10" fill="#00D2FF">Llegada: 34% (+1 parada)</text>
    </g>

    <!-- Perfil Altimétrico Mini -->
    <g transform="translate(30, 290)">
      <path d="M 0 50 Q 40 10 90 35 T 176 20 L 176 60 L 0 60 Z" fill="#00D2FF" fill-opacity="0.2" />
      <path d="M 0 50 Q 40 10 90 35 T 176 20" fill="none" stroke="#00F5A0" stroke-width="2" />
      <text x="0" y="74" font-family="'Space Mono', monospace" font-size="9" fill="#94A3B8">Altimetría: 2,850m - 4,100m</text>
    </g>

    <!-- Botón Navegar -->
    <g transform="translate(30, 380)">
      <rect width="176" height="34" rx="17" fill="#00D2FF" />
      <text x="88" y="22" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" fill="#020617" text-anchor="middle">
        NAVEGAR EN VIVO
      </text>
    </g>
  </g>
</svg>
