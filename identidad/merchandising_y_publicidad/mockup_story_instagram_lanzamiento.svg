<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="story-glow" cx="50%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#14263E" />
      <stop offset="50%" stop-color="#070B12" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <linearGradient id="story-bolt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <filter id="story-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Fondo Vertical 1080x1920 -->
  <rect width="1080" height="1920" fill="url(#story-glow)" />

  <!-- Luces Neón Superiores e Inferiores -->
  <circle cx="540" cy="300" r="350" fill="#00D2FF" opacity="0.18" filter="url(#story-blur)" />
  <circle cx="540" cy="1500" r="400" fill="#00F5A0" opacity="0.15" filter="url(#story-blur)" />

  <!-- Header: Logo Oficial ChargeWay con Isotipo -->
  <g transform="translate(100, 150)">
    <g transform="translate(0, -15) scale(0.24)">
      <path d="M 256 60 C 150 60 76 142 76 242 C 76 312 136 386 216 452 L 256 488 C 240 450 200 380 180 340 C 146 276 136 240 136 216 C 136 150 186 112 256 112 C 302 112 340 132 366 166 L 406 130 C 370 86 318 60 256 60 Z" fill="#94A3B8" stroke="#00F5A0" stroke-width="4" />
      <path d="M 374 168 C 410 214 424 266 414 316 C 400 386 338 440 256 488 C 290 440 340 376 356 320 C 370 270 358 224 330 188 L 374 168 Z" fill="#0F172A" stroke="#00D2FF" stroke-width="6" />
      <path d="M 346 198 C 370 240 374 285 362 334 C 346 390 298 446 260 482" fill="none" stroke="#00F5A0" stroke-width="8" stroke-dasharray="14 18" stroke-linecap="round" />
      <polygon points="280,100 196,248 266,248 226,376 332,224 260,224" fill="#00D2FF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
      <polygon points="276,118 208,244 264,244 236,346 314,228 258,228" fill="#FFFFFF" opacity="0.8" />
      <circle cx="256" cy="488" r="14" fill="#00F5A0" />
    </g>
    <g transform="translate(115, 35)">
      <text font-family="'Syne', sans-serif" font-size="48" font-weight="900" fill="#FFFFFF">
        Charge<tspan fill="#00D2FF">Way</tspan>
      </text>
      <text x="320" y="-12" font-family="'Space Mono', monospace" font-size="14" font-weight="700" fill="#00F5A0" letter-spacing="3">
        ECUADOR
      </text>
    </g>
  </g>

  <!-- Titular Principal Impactante -->
  <g transform="translate(100, 320)">
    <text font-family="'Space Mono', monospace" font-size="18" font-weight="700" fill="#00F5A0" letter-spacing="4">
      // VIAJES INTERPROVINCIALES EN EV
    </text>
    <text y="80" font-family="'Syne', sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" line-height="1.05" letter-spacing="-2">
      ¿QUITO A CUENCA?
    </text>
    <text y="170" font-family="'Syne', sans-serif" font-size="76" font-weight="900" fill="url(#story-bolt)" line-height="1.05" letter-spacing="-2">
      LLEGA SEGURO.
    </text>
    <text y="240" font-family="'Space Grotesk', sans-serif" font-size="24" fill="#CBD5E1">
      Calcula tu batería con altimetría y orografía andina real.
    </text>
  </g>

  <!-- Mockup Móvil Flotante en Story -->
  <g transform="translate(180, 680)">
    <!-- Celular -->
    <rect width="720" height="740" rx="44" fill="#0A111E" stroke="#00D2FF" stroke-width="3.5" />
    <rect x="20" y="20" width="680" height="700" rx="34" fill="#070B12" />

    <!-- Datos de Ruta Simulada -->
    <g transform="translate(50, 60)">
      <!-- Origen y Destino -->
      <text font-family="'Space Mono', monospace" font-size="14" fill="#94A3B8">ORIGEN ➔ DESTINO</text>
      <text y="35" font-family="'Syne', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">Quito (2,850m) ➔ Cuenca (2,560m)</text>
      <text y="65" font-family="'Space Mono', monospace" font-size="14" fill="#00F5A0">DISTANCIA: 467 KM • PASO POR CAJAS: 4,100M</text>
    </g>

    <!-- Indicador Radial SoC -->
    <g transform="translate(50, 180)">
      <circle cx="100" cy="100" r="80" fill="none" stroke="#1E293B" stroke-width="16" />
      <circle cx="100" cy="100" r="80" fill="none" stroke="#00F5A0" stroke-width="16" stroke-dasharray="380 502" stroke-linecap="round" />
      <text x="100" y="105" font-family="'Space Mono', monospace" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">79%</text>
      <text x="100" y="135" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#00F5A0" text-anchor="middle">Batería Óptima</text>
      
      <!-- Datos al lado del gauge -->
      <g transform="translate(230, 40)">
        <text font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">SoC Estimado en Destino</text>
        <text y="35" font-family="'Space Mono', monospace" font-size="30" font-weight="900" fill="#00D2FF">38% RESTANTE</text>
        <text y="65" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#94A3B8">1 Parada rápida de 18 min en Alausí (24kW)</text>
      </g>
    </g>

    <!-- Perfil Altimétrico Visual -->
    <g transform="translate(50, 430)">
      <text font-family="'Space Mono', monospace" font-size="13" fill="#64748B">PERFIL ALTIMÉTRICO Y REGENERACIÓN GRAVITATORIA</text>
      <!-- Gráfico de montaña -->
      <path d="M 0 160 Q 120 40 260 110 T 480 30 T 600 130 L 600 200 L 0 200 Z" fill="#00D2FF" fill-opacity="0.15" />
      <path d="M 0 160 Q 120 40 260 110 T 480 30 T 600 130" fill="none" stroke="#00F5A0" stroke-width="3.5" />
      <circle cx="480" cy="30" r="6" fill="#FFFFFF" stroke="#00D2FF" stroke-width="2" />
      <text x="495" y="35" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#FFFFFF">Páramo 4,100m</text>
    </g>
  </g>

  <!-- Botón Interactivo Swipe Up / Enlace -->
  <g transform="translate(180, 1540)">
    <rect width="720" height="90" rx="45" fill="url(#story-bolt)" />
    <text x="360" y="55" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800" fill="#020617" text-anchor="middle" letter-spacing="1">
      PLANIFICAR MI RUTA GRATIS ➔
    </text>
  </g>

  <!-- Flechas hacia arriba animadas -->
  <g transform="translate(540, 1720)" stroke="#00D2FF" stroke-width="3" fill="none" opacity="0.8">
    <path d="M -15 15 L 0 0 L 15 15" />
    <path d="M -15 30 L 0 15 L 15 30" opacity="0.5" />
  </g>
  <text x="540" y="1790" font-family="'Space Mono', monospace" font-size="14" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="3">
    DESLIZA HACIA ARRIBA • CHARGEWAY.EC
  </text>
</svg>
