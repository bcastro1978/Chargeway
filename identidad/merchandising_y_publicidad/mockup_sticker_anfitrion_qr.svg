<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%" fill="none">
  <defs>
    <!-- Sombra del Vinilo Adhesivo -->
    <filter id="sticker-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <linearGradient id="sticker-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#070B12" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <linearGradient id="sticker-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <g transform="translate(30, 25)" filter="url(#sticker-shadow)">
    <!-- Cuerpo del Vinilo Adhesivo (Acabado Mate Resistente a UV) -->
    <rect width="540" height="700" rx="28" fill="url(#sticker-bg)" stroke="url(#sticker-border)" stroke-width="4" />

    <!-- Barra Superior: Logo Oficial ChargeWay con Isotipo -->
    <g transform="translate(45, 45)">
      <!-- Isotipo Oficial de ChargeWay Escalado -->
      <g transform="translate(0, -10) scale(0.16)">
        <path d="M 256 60 C 150 60 76 142 76 242 C 76 312 136 386 216 452 L 256 488 C 240 450 200 380 180 340 C 146 276 136 240 136 216 C 136 150 186 112 256 112 C 302 112 340 132 366 166 L 406 130 C 370 86 318 60 256 60 Z" fill="#94A3B8" stroke="#00F5A0" stroke-width="4" />
        <path d="M 374 168 C 410 214 424 266 414 316 C 400 386 338 440 256 488 C 290 440 340 376 356 320 C 370 270 358 224 330 188 L 374 168 Z" fill="#0F172A" stroke="#00D2FF" stroke-width="6" />
        <path d="M 346 198 C 370 240 374 285 362 334 C 346 390 298 446 260 482" fill="none" stroke="#00F5A0" stroke-width="8" stroke-dasharray="14 18" stroke-linecap="round" />
        <polygon points="280,100 196,248 266,248 226,376 332,224 260,224" fill="#00D2FF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
        <polygon points="276,118 208,244 264,244 236,346 314,228 258,228" fill="#FFFFFF" opacity="0.8" />
        <circle cx="256" cy="488" r="14" fill="#00F5A0" />
      </g>
      <!-- Texto -->
      <g transform="translate(85, 25)">
        <text font-family="'Syne', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">
          Charge<tspan fill="#00D2FF">Way</tspan>
        </text>
      </g>
      <!-- Badge de Anfitrión Verificado -->
      <g transform="translate(320, 5)">
        <rect width="165" height="30" rx="8" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5" />
        <text x="82" y="20" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" fill="#00F5A0" text-anchor="middle" letter-spacing="1">
          PUNTO VERIFICADO
        </text>
      </g>
    </g>

    <!-- Título Principal de Señalización -->
    <g transform="translate(45, 125)">
      <text font-family="'Syne', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" line-height="1.2">
        ESTACIÓN DE CARGA
      </text>
      <text y="32" font-family="'Syne', sans-serif" font-size="28" font-weight="800" fill="#00F5A0">
        VEHICULAR ELÉCTRICA
      </text>
      <text y="62" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#94A3B8">
        Espacio exclusivo con punto de recarga de alta eficiencia
      </text>
    </g>

    <!-- Contenedor Central del Código QR Dinámico -->
    <g transform="translate(135, 220)">
      <!-- Fondo Blanco de Alto Contraste para lectura con cámara bajo el sol -->
      <rect width="270" height="270" rx="20" fill="#FFFFFF" stroke="#00D2FF" stroke-width="3" />

      <!-- QR Estilizado Vectorial -->
      <g fill="#070B12" transform="translate(25, 25)">
        <!-- Ojo Superior Izquierdo -->
        <rect x="0" y="0" width="60" height="60" rx="8" />
        <rect x="10" y="10" width="40" height="40" rx="4" fill="#FFFFFF" />
        <rect x="18" y="18" width="24" height="24" rx="2" />

        <!-- Ojo Superior Derecho -->
        <rect x="160" y="0" width="60" height="60" rx="8" />
        <rect x="170" y="10" width="40" height="40" rx="4" fill="#FFFFFF" />
        <rect x="178" y="18" width="24" height="24" rx="2" />

        <!-- Ojo Inferior Izquierdo -->
        <rect x="0" y="160" width="60" height="60" rx="8" />
        <rect x="10" y="170" width="40" height="40" rx="4" fill="#FFFFFF" />
        <rect x="18" y="178" width="24" height="24" rx="2" />

        <!-- Patrón de Datos QR -->
        <rect x="80" y="10" width="18" height="38" rx="2" />
        <rect x="110" y="20" width="30" height="18" rx="2" />
        <rect x="75" y="70" width="70" height="16" rx="2" />
        <rect x="10" y="80" width="40" height="18" rx="2" />
        <rect x="165" y="80" width="45" height="18" rx="2" />
        <rect x="85" y="110" width="50" height="50" rx="4" fill="#00D2FF" />

        <!-- Icono Mini Rayo dentro del QR -->
        <polygon points="113,118 103,136 112,136 106,152 120,132 112,132" fill="#070B12" />

        <rect x="160" y="115" width="20" height="45" rx="2" />
        <rect x="195" y="125" width="20" height="30" rx="2" />
        <rect x="80" y="180" width="55" height="25" rx="2" />
        <rect x="150" y="180" width="65" height="35" rx="2" />
      </g>
    </g>

    <!-- Instrucciones de Uso Rápido en 3 Pasos -->
    <g transform="translate(60, 525)">
      <!-- Paso 1 -->
      <g transform="translate(0, 0)">
        <circle cx="20" cy="20" r="16" fill="#00D2FF" fill-opacity="0.2" stroke="#00D2FF" stroke-width="1.5" />
        <text x="20" y="25" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#00D2FF" text-anchor="middle">1</text>
        <text x="48" y="18" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Escanea el QR</text>
        <text x="48" y="34" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#94A3B8">Abre con la cámara de tu teléfono</text>
      </g>

      <!-- Paso 2 -->
      <g transform="translate(0, 50)">
        <circle cx="20" cy="20" r="16" fill="#00F5A0" fill-opacity="0.2" stroke="#00F5A0" stroke-width="1.5" />
        <text x="20" y="25" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#00F5A0" text-anchor="middle">2</text>
        <text x="48" y="18" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Confirma tu Reserva</text>
        <text x="48" y="34" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#94A3B8">Selecciona tiempo y tarifa autorizada</text>
      </g>

      <!-- Paso 3 -->
      <g transform="translate(0, 100)">
        <circle cx="20" cy="20" r="16" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5" />
        <text x="20" y="25" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#10B981" text-anchor="middle">3</text>
        <text x="48" y="18" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Conecta y Carga</text>
        <text x="48" y="34" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#94A3B8">Monitorea los kWh y SoC en vivo</text>
      </g>
    </g>

    <!-- Pie del Vinilo -->
    <g transform="translate(45, 680)">
      <text font-family="'Space Mono', monospace" font-size="9" fill="#64748B" letter-spacing="1">
        COMPLIANCE ARCONEL // RED SAAS CHARGEWAY ECUADOR // WWW.CHARGEWAY.EC
      </text>
    </g>
  </g>
</svg>
