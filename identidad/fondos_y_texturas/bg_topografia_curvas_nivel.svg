<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradiente de Elevación (Valle a Cumbre Andina) -->
    <linearGradient id="topo-elevation-1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#00F5A0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="route-highway-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="45%" stop-color="#00F5A0" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="topo-neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="topo-vignette" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="#070B12" stop-opacity="0" />
      <stop offset="100%" stop-color="#030508" stop-opacity="0.9" />
    </radialGradient>
  </defs>

  <!-- Fondo Profundo Azul Espacio -->
  <rect width="100%" height="100%" fill="#070B12" />

  <!-- Curvas de Nivel Topográficas Vectoriales (Topografía Andina Ecuatoriana) -->
  <g fill="none" stroke-linecap="round">
    <!-- Nivel 1: Valle Base 2,000m -->
    <path d="M -100 850 C 300 780 600 920 1050 820 C 1450 720 1750 880 2050 800" stroke="#00D2FF" stroke-width="1.5" stroke-opacity="0.1" />
    <path d="M -100 750 C 320 680 620 810 1080 710 C 1480 620 1780 770 2050 700" stroke="#00D2FF" stroke-width="1.5" stroke-opacity="0.14" />
    
    <!-- Nivel 2: Meseta Andina 2,800m (Quito / Machachi) -->
    <path d="M -100 650 C 350 560 660 700 1100 600 C 1500 510 1800 660 2050 590" stroke="#00F5A0" stroke-width="1.8" stroke-opacity="0.18" />
    <path d="M -100 560 C 380 470 690 600 1140 490 C 1530 400 1820 560 2050 490" stroke="#00F5A0" stroke-width="2" stroke-opacity="0.22" />

    <!-- Nivel 3: Páramo & Cañón Guayllabamba 3,200m -->
    <path d="M -50 480 C 400 370 720 500 1180 390 C 1560 300 1850 460 2000 390" stroke="url(#topo-elevation-1)" stroke-width="2.2" stroke-opacity="0.3" />
    <path d="M -50 400 C 420 290 750 410 1200 300 C 1600 200 1880 360 2000 300" stroke="url(#topo-elevation-1)" stroke-width="2.5" stroke-opacity="0.35" />

    <!-- Nivel 4: Crestas y Macizo Cotopaxi 4,800m+ -->
    <path d="M 100 320 C 500 180 800 320 1250 210 C 1650 120 1900 280 2050 210" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.45" filter="url(#topo-neon)" />
    <path d="M 250 240 C 600 120 850 230 1300 130 C 1700 60 1950 180 2050 130" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6" />

    <!-- Círculos de Cotas Altimétricas Concéntricas (Volcanes / Nodos de Carga) -->
    <!-- Volcán Cotopaxi (Punto Estratégico de Paso) -->
    <g transform="translate(1450, 420)">
      <circle r="220" stroke="#00D2FF" stroke-width="1.2" stroke-opacity="0.15" stroke-dasharray="8 8" />
      <circle r="160" stroke="#00F5A0" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 6" />
      <circle r="100" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4" />
      <circle r="40" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.7" fill="#00F5A0" fill-opacity="0.2" filter="url(#topo-neon)" />
      <circle r="8" fill="#00F5A0" />
      <!-- Etiqueta Altimétrica -->
      <text x="50" y="-10" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">
        COTOPAXI SUMMIT // 5,897 M
      </text>
      <text x="50" y="12" font-family="'Space Mono', monospace" font-size="11" fill="#00F5A0">
        PUNTO DE REGENERACIÓN GRAVITATORIA E35 (+8.4% SoC)
      </text>
    </g>

    <!-- Nudo de Cajas / Azuay -->
    <g transform="translate(420, 780)">
      <circle r="180" stroke="#00D2FF" stroke-width="1" stroke-opacity="0.15" />
      <circle r="110" stroke="#00F5A0" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 6" />
      <circle r="50" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4" />
      <circle r="6" fill="#00D2FF" />
      <text x="-160" y="35" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#94A3B8">
        PARQUE NACIONAL CAJAS // 4,100 M
      </text>
    </g>
  </g>

  <!-- Autopista de Alta Velocidad E35 / Corredor Troncal Electrificado -->
  <path d="M 280 920 C 480 820 620 680 850 560 S 1120 450 1350 320 S 1650 240 1850 180" 
        fill="none" 
        stroke="url(#route-highway-glow)" 
        stroke-width="7" 
        stroke-linecap="round" 
        filter="url(#topo-neon)" />

  <path d="M 280 920 C 480 820 620 680 850 560 S 1120 450 1350 320 S 1650 240 1850 180" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-dasharray="16 20" />

  <!-- Viñeta Gradual -->
  <rect width="100%" height="100%" fill="url(#topo-vignette)" pointer-events="none" />
</svg>
