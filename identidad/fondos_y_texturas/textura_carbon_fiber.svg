<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Gradientes de Trama Carbono 2x2 Twill Weave -->
    <linearGradient id="twill-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18202F" />
      <stop offset="50%" stop-color="#0F1723" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>

    <linearGradient id="twill-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232D3F" />
      <stop offset="50%" stop-color="#141C28" />
      <stop offset="100%" stop-color="#0A0E17" />
    </linearGradient>

    <linearGradient id="twill-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <rect width="160" height="160" fill="#0A0E17" />

  <!-- Bloques de Fibra Horizontales y Verticales Entrelazados -->
  <!-- Fila 0 -->
  <rect x="0" y="0" width="40" height="40" fill="url(#twill-h)" />
  <rect x="0" y="0" width="40" height="40" fill="url(#twill-highlight)" />
  <rect x="40" y="0" width="40" height="40" fill="url(#twill-v)" />
  <rect x="80" y="0" width="40" height="40" fill="url(#twill-h)" />
  <rect x="80" y="0" width="40" height="40" fill="url(#twill-highlight)" />
  <rect x="120" y="0" width="40" height="40" fill="url(#twill-v)" />

  <!-- Fila 1 -->
  <rect x="0" y="40" width="40" height="40" fill="url(#twill-v)" />
  <rect x="40" y="40" width="40" height="40" fill="url(#twill-h)" />
  <rect x="40" y="40" width="40" height="40" fill="url(#twill-highlight)" />
  <rect x="80" y="40" width="40" height="40" fill="url(#twill-v)" />
  <rect x="120" y="40" width="40" height="40" fill="url(#twill-h)" />
  <rect x="120" y="40" width="40" height="40" fill="url(#twill-highlight)" />

  <!-- Fila 2 -->
  <rect x="0" y="80" width="40" height="40" fill="url(#twill-h)" />
  <rect x="0" y="80" width="40" height="40" fill="url(#twill-highlight)" />
  <rect x="40" y="80" width="40" height="40" fill="url(#twill-v)" />
  <rect x="80" y="80" width="40" height="40" fill="url(#twill-h)" />
  <rect x="80" y="80" width="40" height="40" fill="url(#twill-highlight)" />
  <rect x="120" y="80" width="40" height="40" fill="url(#twill-v)" />

  <!-- Fila 3 -->
  <rect x="0" y="120" width="40" height="40" fill="url(#twill-v)" />
  <rect x="40" y="120" width="40" height="40" fill="url(#twill-h)" />
  <rect x="40" y="120" width="40" height="40" fill="url(#twill-highlight)" />
  <rect x="80" y="120" width="40" height="40" fill="url(#twill-v)" />
  <rect x="120" y="120" width="40" height="40" fill="url(#twill-h)" />
  <rect x="120" y="120" width="40" height="40" fill="url(#twill-highlight)" />

  <!-- Líneas de Trama Estriada en Cada Celda -->
  <g stroke="#000000" stroke-width="1" opacity="0.4">
    <line x1="0" y1="10" x2="160" y2="10" />
    <line x1="0" y1="20" x2="160" y2="20" />
    <line x1="0" y1="30" x2="160" y2="30" />
    <line x1="0" y1="50" x2="160" y2="50" />
    <line x1="0" y1="60" x2="160" y2="60" />
    <line x1="0" y1="70" x2="160" y2="70" />
    <line x1="0" y1="90" x2="160" y2="90" />
    <line x1="0" y1="100" x2="160" y2="100" />
    <line x1="0" y1="110" x2="160" y2="110" />
    <line x1="0" y1="130" x2="160" y2="130" />
    <line x1="0" y1="140" x2="160" y2="140" />
    <line x1="0" y1="150" x2="160" y2="150" />

    <line x1="10" y1="0" x2="10" y2="160" />
    <line x1="20" y1="0" x2="20" y2="160" />
    <line x1="30" y1="0" x2="30" y2="160" />
    <line x1="50" y1="0" x2="50" y2="160" />
    <line x1="60" y1="0" x2="60" y2="160" />
    <line x1="70" y1="0" x2="70" y2="160" />
    <line x1="90" y1="0" x2="90" y2="160" />
    <line x1="100" y1="0" x2="100" y2="160" />
    <line x1="110" y1="0" x2="110" y2="160" />
    <line x1="130" y1="0" x2="130" y2="160" />
    <line x1="140" y1="0" x2="140" y2="160" />
    <line x1="150" y1="0" x2="150" y2="160" />
  </g>
</svg>
