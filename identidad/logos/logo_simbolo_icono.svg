<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filtros de Resplandor Neón Luminous -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradiente Metálico Titanio / Acero Cepillado para el Pin -->
    <linearGradient id="metal-pin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="25%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="75%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Gradiente Eléctrico Rayo (Cyber Lime a Neon Cyan) -->
    <linearGradient id="electric-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Gradiente Carretera (Asfalto High-Tech + Bordes Neón) -->
    <linearGradient id="highway-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="highway-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Gradiente Sombra Profunda -->
    <radialGradient id="inner-darkness" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#070B12" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020408" stop-opacity="1" />
    </radialGradient>
  </defs>

  <!-- Halo de Luz de Fondo -->
  <circle cx="256" cy="240" r="180" fill="url(#electric-bolt)" opacity="0.12" filter="url(#neon-glow)" />

  <!-- Símbolo Central: Pin de Geolocalización Híbrido -->
  <g transform="translate(0, 0)">
    
    <!-- 1. Arco Exterior Metálico Izquierdo (Cuerpo del Pin de Carga) -->
    <path d="M 256 60 C 150 60 76 142 76 242 C 76 312 136 386 216 452 L 256 488 C 240 450 200 380 180 340 C 146 276 136 240 136 216 C 136 150 186 112 256 112 C 302 112 340 132 366 166 L 406 130 C 370 86 318 60 256 60 Z" 
          fill="url(#metal-pin)" 
          stroke="#00F5A0" 
          stroke-width="3" 
          stroke-opacity="0.6" 
          filter="url(#subtle-glow)" />

    <!-- Bisel Interior Reflejo Luz -->
    <path d="M 256 75 C 165 75 96 148 96 236 C 96 295 142 360 216 430 C 160 365 148 290 148 226 C 148 160 192 124 256 124 C 292 124 326 140 350 168 L 372 144 C 342 100 300 75 256 75 Z" 
          fill="#FFFFFF" 
          opacity="0.25" />

    <!-- 2. Sector Carretera Winding Highway (Lado Derecho del Pin) -->
    <path d="M 374 168 C 410 214 424 266 414 316 C 400 386 338 440 256 488 C 290 440 340 376 356 320 C 370 270 358 224 330 188 L 374 168 Z" 
          fill="url(#highway-body)" 
          stroke="url(#highway-edge)" 
          stroke-width="5" 
          filter="url(#neon-glow)" />

    <!-- Línea Punteada Central de Carretera (Lane Markings Brillantes) -->
    <path d="M 346 198 C 370 240 374 285 362 334 C 346 390 298 446 260 482" 
          fill="none" 
          stroke="#00D2FF" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-dasharray="14 18" 
          filter="url(#neon-glow)" />

    <path d="M 346 198 C 370 240 374 285 362 334 C 346 390 298 446 260 482" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-dasharray="14 18" />

    <!-- 3. Rayo Central Eléctrico Dinámico (Poder EV) -->
    <!-- Contorno de Resplandor Neón del Rayo -->
    <polygon points="280,100 196,248 266,248 226,376 332,224 260,224" 
             fill="url(#electric-bolt)" 
             filter="url(#neon-glow)" 
             opacity="0.85" />

    <!-- Cuerpo Principal del Rayo -->
    <polygon points="280,100 196,248 266,248 226,376 332,224 260,224" 
             fill="url(#electric-bolt)" 
             stroke="#FFFFFF" 
             stroke-width="4" 
             stroke-linejoin="round" />

    <!-- Núcleo de Energía Blanco Puro Central del Rayo -->
    <polygon points="276,118 208,244 264,244 236,346 314,228 258,228" 
             fill="#FFFFFF" 
             opacity="0.75" />

    <!-- 4. Pulsos de Ondas Radiales (Conectividad GPS / Telemetría) -->
    <circle cx="256" cy="488" r="14" fill="#00F5A0" opacity="0.9" filter="url(#subtle-glow)" />
    <circle cx="256" cy="488" r="28" fill="none" stroke="#00D2FF" stroke-width="2" opacity="0.5" />
    <circle cx="256" cy="488" r="42" fill="none" stroke="#00F5A0" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3" />
  </g>
</svg>
