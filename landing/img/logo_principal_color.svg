<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradiente Metálico para el Pin -->
    <linearGradient id="main-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="25%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="75%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Gradiente Eléctrico Neón (Lime a Cyan) -->
    <linearGradient id="main-electric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="60%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Gradiente Texto Principal -->
    <linearGradient id="text-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <!-- Filtro de Resplandor Neón -->
    <filter id="main-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="symbol-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#070B12" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Aura Luminosa detrás del símbolo -->
  <circle cx="130" cy="130" r="110" fill="url(#symbol-aura)" />

  <!-- SÍMBOLO ICONOGRÁFICO IZQUIERDA (Escala ~0.44 para encajar en 200x200 centrado en x=130, y=130) -->
  <g transform="translate(20, 20) scale(0.43)">
    <!-- Arco Exterior Metálico -->
    <path d="M 256 60 C 150 60 76 142 76 242 C 76 312 136 386 216 452 L 256 488 C 240 450 200 380 180 340 C 146 276 136 240 136 216 C 136 150 186 112 256 112 C 302 112 340 132 366 166 L 406 130 C 370 86 318 60 256 60 Z" 
          fill="url(#main-metal)" 
          stroke="#00F5A0" 
          stroke-width="4" 
          stroke-opacity="0.7" 
          filter="url(#main-glow)" />

    <!-- Carretera Lado Derecho -->
    <path d="M 374 168 C 410 214 424 266 414 316 C 400 386 338 440 256 488 C 290 440 340 376 356 320 C 370 270 358 224 330 188 L 374 168 Z" 
          fill="#0F172A" 
          stroke="#00D2FF" 
          stroke-width="6" 
          filter="url(#main-glow)" />

    <!-- Línea Central Punteada -->
    <path d="M 346 198 C 370 240 374 285 362 334 C 346 390 298 446 260 482" 
          fill="none" 
          stroke="#00F5A0" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-dasharray="14 18" />

    <!-- Rayo Central Eléctrico -->
    <polygon points="280,100 196,248 266,248 226,376 332,224 260,224" 
             fill="url(#main-electric)" 
             filter="url(#main-glow)" />
    <polygon points="280,100 196,248 266,248 226,376 332,224 260,224" 
             fill="url(#main-electric)" 
             stroke="#FFFFFF" 
             stroke-width="3" 
             stroke-linejoin="round" />
    <polygon points="276,118 208,244 264,244 236,346 314,228 258,228" 
             fill="#FFFFFF" 
             opacity="0.8" />

    <!-- Punto GPS Pulsante -->
    <circle cx="256" cy="488" r="14" fill="#00F5A0" filter="url(#main-glow)" />
  </g>

  <!-- LOGOTIPO TIPOGRÁFICO: CHARGEWAY -->
  <g transform="translate(255, 135)">
    <!-- Letras "Charge" -->
    <text x="0" y="0" font-family="'Syne', 'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="url(#text-glow)" letter-spacing="-1">
      Charge<tspan fill="#00D2FF" filter="url(#main-glow)">Way</tspan>
    </text>

    <!-- Badge País "ECUADOR" -->
    <g transform="translate(470, -68)">
      <rect x="0" y="0" width="105" height="26" rx="6" ry="6" fill="#00D2FF" fill-opacity="0.15" stroke="#00D2FF" stroke-width="1.5" />
      <text x="52" y="18" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="2.5">
        ECUADOR
      </text>
    </g>

    <!-- Subtítulo Descriptor de Marca -->
    <text x="5" y="44" font-family="'Space Mono', monospace" font-size="16" font-weight="700" fill="#94A3B8" letter-spacing="5.5">
      RED NACIONAL ULTRA-FAST EV
    </text>

    <!-- Línea Acento Eléctrico Inferior -->
    <line x1="5" y1="62" x2="570" y2="62" stroke="url(#main-electric)" stroke-width="2.5" opacity="0.6" stroke-linecap="round" />
  </g>
</svg>
