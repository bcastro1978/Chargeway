<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="partner-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="30%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="partner-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <filter id="partner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- SÍMBOLO IZQUIERDA -->
  <g transform="translate(20, 20) scale(0.43)">
    <path d="M 256 60 C 150 60 76 142 76 242 C 76 312 136 386 216 452 L 256 488 C 240 450 200 380 180 340 C 146 276 136 240 136 216 C 136 150 186 112 256 112 C 302 112 340 132 366 166 L 406 130 C 370 86 318 60 256 60 Z" 
          fill="url(#partner-metal)" 
          stroke="#10B981" 
          stroke-width="4" 
          filter="url(#partner-glow)" />

    <path d="M 374 168 C 410 214 424 266 414 316 C 400 386 338 440 256 488 C 290 440 340 376 356 320 C 370 270 358 224 330 188 L 374 168 Z" 
          fill="#0F172A" 
          stroke="#00F5A0" 
          stroke-width="5" />

    <path d="M 346 198 C 370 240 374 285 362 334 C 346 390 298 446 260 482" 
          fill="none" 
          stroke="#00F5A0" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-dasharray="14 18" />

    <polygon points="280,100 196,248 266,248 226,376 332,224 260,224" 
             fill="url(#partner-emerald)" 
             filter="url(#partner-glow)" />
    <polygon points="280,100 196,248 266,248 226,376 332,224 260,224" 
             fill="url(#partner-emerald)" 
             stroke="#FFFFFF" 
             stroke-width="3" 
             stroke-linejoin="round" />

    <circle cx="256" cy="488" r="14" fill="#10B981" filter="url(#partner-glow)" />
  </g>

  <!-- TIPOGRAFÍA -->
  <g transform="translate(255, 135)">
    <text x="0" y="0" font-family="'Syne', 'Space Grotesk', system-ui, sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      Charge<tspan fill="#00D2FF">Way</tspan>
    </text>

    <!-- Badge PARTNER -->
    <g transform="translate(435, -58)">
      <rect x="0" y="0" width="160" height="32" rx="8" ry="8" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="2" />
      <text x="80" y="22" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" fill="#00F5A0" text-anchor="middle" letter-spacing="3">
        PARTNER
      </text>
    </g>

    <!-- Subtítulo Red de Anfitriones y Electrolineras -->
    <text x="5" y="44" font-family="'Space Mono', monospace" font-size="15" font-weight="700" fill="#94A3B8" letter-spacing="4">
      RED OFICIAL DE ANFITRIONES Y PARQUEOS EV
    </text>

    <line x1="5" y1="62" x2="600" y2="62" stroke="url(#partner-emerald)" stroke-width="2.5" opacity="0.8" stroke-linecap="round" />
  </g>
</svg>
