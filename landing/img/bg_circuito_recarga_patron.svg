<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="trace-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Fondo Transparente o Fondo Oscuro -->
  <rect width="400" height="400" fill="#070B12" />

  <!-- Trazas de Circuito de Carga de Alta Potencia (Seamless 400x400) -->
  <g stroke="url(#trace-cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <!-- Pista 1: Horizontal a 45 grados -->
    <path d="M 0 100 L 120 100 L 160 140 L 260 140 L 300 100 L 400 100" />
    
    <!-- Pista 2: Diagonal inferior -->
    <path d="M 0 300 L 80 300 L 140 240 L 240 240 L 300 300 L 400 300" />

    <!-- Pistas Verticales / Conectores -->
    <path d="M 100 0 L 100 60 L 60 100" />
    <path d="M 300 0 L 300 60 L 340 100" />
    <path d="M 100 400 L 100 340 L 60 300" />
    <path d="M 300 400 L 300 340 L 340 300" />

    <!-- Conexiones Centrales y Derivaciones -->
    <path d="M 200 140 L 200 240" />
    <path d="M 160 140 L 140 160 L 140 220 L 140 240" />
    <path d="M 260 140 L 280 160 L 280 220 L 260 240" />
  </g>

  <!-- Nodos de Carga (Puntos de Soldadura / Conectores) -->
  <g fill="#070B12" stroke="#00F5A0" stroke-width="2">
    <circle cx="120" cy="100" r="5" fill="#00F5A0" />
    <circle cx="260" cy="140" r="5" fill="#00D2FF" />
    <circle cx="80" cy="300" r="5" fill="#00F5A0" />
    <circle cx="240" cy="240" r="5" fill="#00D2FF" />
    <circle cx="200" cy="190" r="7" fill="#00F5A0" />
    <circle cx="200" cy="190" r="3" fill="#FFFFFF" />
  </g>

  <!-- Micro Rayo Central -->
  <polygon points="204,182 196,192 201,192 198,200 205,190 200,190" fill="#070B12" />

  <!-- Micro-marcas de Cuadrícula Auxiliares -->
  <circle cx="0" cy="0" r="2" fill="#00D2FF" opacity="0.3" />
  <circle cx="400" cy="0" r="2" fill="#00D2FF" opacity="0.3" />
  <circle cx="0" cy="400" r="2" fill="#00D2FF" opacity="0.3" />
  <circle cx="400" cy="400" r="2" fill="#00D2FF" opacity="0.3" />
</svg>
