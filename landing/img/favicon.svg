<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="fav-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
  </defs>

  <!-- Fondo squircle oscuro redondeado -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#fav-bg)" stroke="#00D2FF" stroke-width="2" />

  <!-- Símbolo estilizado para máxima legibilidad en 16x16 / 32x32 -->
  <!-- Arco Pin Metálico Izquierdo -->
  <path d="M 32 10 C 20 10 12 18 12 29 C 12 37 19 46 27 54 L 32 58 C 30 54 26 46 24 41 C 21 34 20 30 20 28 C 20 20 25 16 32 16 C 37 16 41 18 44 22 L 49 18 C 45 13 39 10 32 10 Z" fill="#94A3B8" />

  <!-- Carretera Curva Derecha Neón -->
  <path d="M 46 22 C 50 28 51 34 50 39 C 48 47 41 53 32 58 C 36 53 41 46 43 40 C 45 34 44 29 40 25 L 46 22 Z" fill="#00D2FF" />

  <!-- Rayo Central Eléctrico -->
  <polygon points="35,14 24,31 32,31 28,47 41,29 33,29" fill="url(#fav-bolt)" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Punto GPS Base -->
  <circle cx="32" cy="58" r="2.5" fill="#00F5A0" />
</svg>
